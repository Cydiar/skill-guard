<!DOCTYPE html>
<html lang="en" x-data="{ darkMode: localStorage.getItem('sg-theme') === 'dark', lang: localStorage.getItem('sg-lang') || 'en' }" :class="{ 'dark': darkMode }">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SkillGuard{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      safelist: [
        'bg-orange-500', 'bg-orange-50', 'bg-orange-100',
        'border-orange-200', 'border-orange-300', 'border-orange-700', 'border-orange-800',
        'text-orange-500', 'text-orange-600', 'text-orange-700',
        'dark:bg-orange-900/10', 'dark:bg-orange-900/20', 'dark:bg-orange-900/30',
        'dark:border-orange-700', 'dark:border-orange-800',
        'dark:text-orange-300', 'dark:text-orange-400',
      ],
      theme: {
        extend: {
          colors: {
            'level-a': '#22c55e',
            'level-b': '#3b82f6',
            'level-c': '#eab308',
            'level-d': '#f97316',
            'level-f': '#ef4444',
          }
        }
      }
    }
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="/static/style.css">
  {% block head %}{% endblock %}
</head>
<body class="min-h-screen flex flex-col bg-white dark:bg-gray-950 text-gray-900 dark:text-gray-100 transition-colors" style="overflow-y: scroll">
  <!-- Navigation -->
  <nav class="border-b border-gray-200 dark:border-gray-800 bg-white/80 dark:bg-gray-950/80 backdrop-blur-sm sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <div class="flex items-center gap-6">
          <a href="/" class="text-lg font-bold tracking-tight">
            Skill Guard
          </a>
          <a href="/" class="text-sm text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-gray-100 transition-colors">Home</a>
          <a href="/rules" class="text-sm text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-gray-100 transition-colors">Rules</a>
          <a href="/methodology" class="text-sm text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-gray-100 transition-colors">Methodology</a>
        </div>
        <div class="flex items-center gap-2">
          {% block nav_extras %}{% endblock %}
          <!-- Language Toggle -->
          <button
            @click="lang = lang === 'en' ? 'zh' : 'en'; localStorage.setItem('sg-lang', lang); $dispatch('lang-changed', { lang })"
            class="w-9 h-9 rounded-lg border border-gray-200 dark:border-gray-700 flex items-center justify-center text-xs font-bold text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors"
            title="Toggle language"
          >
            <span x-show="lang==='en'">CN</span>
            <span x-show="lang==='zh'">EN</span>
          </button>
          <!-- Theme Toggle -->
          <button
            @click="darkMode = !darkMode; localStorage.setItem('sg-theme', darkMode ? 'dark' : 'light')"
            class="w-9 h-9 rounded-lg border border-gray-200 dark:border-gray-700 flex items-center justify-center text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors"
            :title="darkMode ? 'Switch to light mode' : 'Switch to dark mode'"
          >
            <svg x-show="!darkMode" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z" />
            </svg>
            <svg x-show="darkMode" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z" />
            </svg>
          </button>
        </div>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="flex-1">
    {% block content %}{% endblock %}
  </main>

  <!-- Footer -->
  <footer class="border-t border-gray-200 dark:border-gray-800 mt-16 py-8">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 text-center text-sm text-gray-500 dark:text-gray-500">
      SkillGuard &mdash; AI Agent Skill Security Auditor &middot; 10 Dimensions &middot; 109 Rules (67 Built-in + 42 Configurable)
    </div>
  </footer>

  <script src="/static/app.js?v=2"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
