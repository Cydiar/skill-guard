version: "3.9"

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  worker:
    build: .
    restart: unless-stopped
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DB_PATH=/app/data/skillguard.db
      # 敏感 key 可在此覆盖，或通过 .env 文件注入
      # - DEEP_SCAN_API_KEY=your_key_here
    volumes:
      - app-data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A app.workers worker --loglevel=info --concurrency=2

  api:
    build: .
    restart: unless-stopped
    ports:
      - "8011:8011"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DB_PATH=/app/data/skillguard.db
      # - DEEP_SCAN_API_KEY=your_key_here
    volumes:
      - app-data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    # CMD 已在 Dockerfile 中定义，此处无需重复

volumes:
  app-data:
  redis-data:
